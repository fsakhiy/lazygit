[package]
name = "lazycommit"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Fairuz Sakhiy <sakhiyfairuz@gmail.com>"]
description = "A lightweight CLI tool that generates git commit messages from git diffs using OpenAI"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
