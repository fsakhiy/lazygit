name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal Linux (Fedora, Arch, Debian, Ubuntu, etc.)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: lazycommit-x86_64-linux.tar.gz

          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: lazycommit-x86_64-windows.zip

          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: lazycommit-aarch64-macos.tar.gz

          # macOS Intel
          - os: macos-13
            target: x86_64-apple-darwin
            asset_name: lazycommit-x86_64-macos.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}
        shell: bash

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset_name }} lazycommit lazycommit-gui lazyreport
          cd ../../..
        shell: bash

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path lazycommit.exe,lazycommit-gui.exe,lazyreport.exe -DestinationPath ../../../${{ matrix.asset_name }}
          cd ../../..
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
